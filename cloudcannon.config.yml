paths:
  static: public
  uploads: public/images/docsImages
  collections: content

timezone: Asia/Shanghai

markdown:
  engine: commonmark
  options: {}

collections_config:
  # CN
  docs_cn_about:
    path: content/docs/cn/about
    icon: check_in_out
    url: /docs/about/[slug]
    output: true
    schemas:
      default:
        path: schemas/docs.md

  docs_cn_blog:
    path: content/docs/cn/blog
    icon: docs_add_on
    url: /docs/blog/[slug]
    output: true
    schemas:
      default:
        path: schemas/docs.md

  docs_cn_docs:
    path: content/docs/cn/docs
    icon: docs_add_on
    url: /docs/docs/[slug]
    output: true
    schemas:
      default:
        path: schemas/docs.md

  docs_cn_notebook:
    path: content/docs/cn/notebook
    icon: dock_to_bottom
    url: /docs/notebook/[slug]
    output: true
    schemas:
      default:
        path: schemas/docs.md

  docs_cn_works:
    path: content/docs/cn/works
    icon: docs_add_on
    url: /docs/works/[slug]
    output: true
    schemas:
      default:
        path: schemas/docs.md

  # EN
  docs_en_about:
    path: content/docs/en/about
    icon: check_in_out
    url: /docs/about/[slug]
    output: true
    schemas:
      default:
        path: schemas/docs.md

  docs_en_blog:
    path: content/docs/en/blog
    icon: docs_add_on
    url: /docs/blog/[slug]
    output: true
    schemas:
      default:
        path: schemas/docs.md

  docs_en_docs:
    path: content/docs/en/docs
    icon: docs_add_on
    url: /docs/docs/[slug]
    output: true
    schemas:
      default:
        path: schemas/docs.md

  docs_en_notebook:
    path: content/docs/en/notebook
    icon: dock_to_bottom
    url: /docs/notebook/[slug]
    output: true
    schemas:
      default:
        path: schemas/docs.md

  docs_en_works:
    path: content/docs/en/works
    icon: home_work
    url: /docs/works/[slug]
    output: true
    schemas:
      default:
        path: schemas/docs.md

_inputs:
  date:
    instance_value: now
    comment: "文档发布日期"
