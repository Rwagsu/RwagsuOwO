      default:
        path: schemas/default-frontmatter.mdx

_inputs:
  title:
    type: text
    comment: Title

  description:
    type: text
    comment: Description

  icon:
    type: text
    comment: Icon (Lucide Icon)

  avatars:
    type: multiselect
    comment: 作者 (ID)
    options:
      values:
        - rwagsu
        - drownedowo
      values_labels:
        rwagsu: "Rwagsu - 全能 Furry 控"
        drownedowo: "DrownedOwO - 被绑架来的 QAQ"

  time:
    type: date
    comment: 创建时间

  tags:
    type: array
    comment: 标签
    options:
      structures: _structures.tag

  headerImage:
    type: object
    comment: Header 图片 (Link)
    options:
      collapsed: true
    _inputs:
      alt:
        type: text
        comment: Alt 文本
      src:
        type: image   # 改用 image 类型，更方便选图
        comment: 图片路径（建议用上传）

  type:
    type: select
    comment: 文档类型
    options:
      values:
        - base
        - image
        - video
        - audio
        - code
        - subHero
        - none
      default: base

  image:
    type: object
    comment: IMAGE 配置（仅当 type=image 时填写，其他忽略）
    options:
      collapsed: true
    _inputs:
      alt:
        type: text
      src:
        type: image
        options:
          width: 1200
          resize_style: crop

  video:
    type: object
    comment: VIDEO 配置（仅当 type=video 时填写，其他忽略）
    options:
      collapsed: true
    _inputs:
      alt:
        type: text
      src:
        type: text
        comment: 视频 URL 或相对路径

  audio:
    type: object
    comment: AUDIO 配置（仅当 type=audio 时填写，其他忽略）
    options:
      collapsed: true
    _inputs:
      alt:
        type: text
      src:
        type: file
        comment: 音频文件路径

  code:
    type: object
    comment: Code 配置（仅当 type=code 时填写，其他忽略）
    options:
      collapsed: true
    _inputs:
      maintenanceLevel:
        type: select
        comment: 维护等级
        options:
          values:
            - X0
            - G1
            - G2
            - G3
            - B4
            - B5
            - R6
            - R7
            - Q8
            - Q9
            - C10
          default: G3
      githubInfo:
        type: object
        comment: GitHub 信息
        _inputs:
          user:
            type: text
            comment: GitHub 所有者
          repo:
            type: text
            comment: 存储库
          branch:
            type: text
            comment: 分支
            instance_value: main
      icon:
        type: object
        comment: Icon (Link)
        _inputs:
          alt:
            type: text
            comment: Alt 文本
          src:
            type: image   # 改成 image 类型
            comment: 图标路径
      buttons:
        type: array
        comment: 按钮
        options:
          structures: _structures.button

  hero:
    type: object
    comment: SubHero 配置（仅当 type=subHero 时填写，其他忽略）
    options:
      collapsed: true
    _inputs:
      buttons:
        type: array
        comment: 按钮
        options:
          structures: _structures.button
      icon:
        type: object
        comment: 图标 (Link)
        _inputs:
          alt:
            type: text
            comment: Alt 文本
          src:
            type: image
            comment: 图标路径
          
timezone: Asia/Shanghai

markdown:
  engine: commonmark
  options:
    xhtml: false
    breaks: false
    linkify: false
    typographer: false
    spaced_lists: false
    sentence_per_line: false
    gfm: false
    code_block_fences: '```'
    escape_snippets_in_code_blocks: false
    treat_indentation_as_code: false
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    attributes: false

_structures:
  tag:
    label: 标签
    icon: label
    value:
      text: ""
      icon: ""
      variant: secondary
    _inputs:
      variant:
        type: select
        options:
          values:
            - outline
            - ghost
            - link
            - default
            - secondary
            - destructive

  button:
    label: 按钮
    icon: smart_button
    value:
      text: ""
      href: ""
      icon: ""
      variant: default
    _inputs:
      variant:
        type: select
        options:
          values:
            - outline
            - ghost
            - link
            - default
            - secondary
            - destructive
      
_snippets:
  # ── Fumadocs 核心 MDX 组件 ──

  fumadocs_card:
    template: mdx_paired_component
    label: Card (Fumadocs)
    icon: card_membership
    value:
      component: Card
      props:
        icon: ""          # 可以是 <Icon /> 或字符串
        href: ""
        title: ""
      children: ""        # 内容占位

  fumadocs_callout:
    template: mdx_paired_component
    label: Callout (Fumadocs)
    icon: announcement
    value:
      component: Callout
      props:
        title: ""
        type: info        # info | warning | error | success | idea
      children: ""

  fumadocs_steps:
    template: markdown
    label: Steps Wrapper (Fumadocs)
    icon: format_list_numbered
    value: |
      <div className="fd-steps [&_h2]:fd-step [&_h3]:fd-step">
          
      </div>

  fumadocs_accordion:
    template: mdx_paired_component
    label: Accordion (Fumadocs)
    icon: keyboard_arrow_down
    value:
      component: Accordion
      props:
        type: single       # single | multiple
        collapsible: true
        defaultValue: ""
      children: ""         # 里面放 <AccordionItem value="one">...</AccordionItem>

  fumadocs_tabs:
    template: markdown
    label: Tabs (Fumadocs - 用代码块方式)
    icon: tab
    value: |
      ```ts tab="Tab 1"
      
      ```

      ```ts tab="Tab 2"
      
      ```

  # ── 代码块增强（Fumadocs 特殊语法） ──

  fumadocs_code_linenumbers:
    template: markdown
    label: Code block with lineNumbers
    icon: numbers
    value: "``` lineNumbers\n\n```"

  fumadocs_code_twoslash:
    template: markdown
    label: Code block with Twoslash
    icon: code
    value: "``` twoslash\n\n```"

  fumadocs_code_highlight:
    template: markdown
    label: [!code highlight]
    icon: highlight
    value: "// [!code highlight]"

  fumadocs_code_add:
    template: markdown
    label: [!code ++] 添加行
    icon: add
    value: "// [!code ++]"

  fumadocs_code_remove:
    template: markdown
    label: [!code --] 删除行
    icon: remove
    value: "// [!code --]"

  fumadocs_code_focus:
    template: markdown
    label: [!code focus] 聚焦行
    icon: center_focus_strong
    value: "// [!code focus]"

  # ── 其他 Fumadocs 实用组件 ──

  fumadocs_files:
    template: mdx_paired_component
    label: Files / Folder Tree
    icon: folder
    value:
      component: Files
      props: {}
      children: |
        <Folder name="src" defaultOpen>
            <File name="index.tsx" />
        </Folder>

  fumadocs_github_info:
    template: mdx_component
    label: GitHub Info
    icon: github
    value:
      component: GithubInfo
      props:
        owner: "fuma-nama"
        repo: "fumadocs"
        # token: process.env.GITHUB_TOKEN  # 可选，注释掉或留空

  fumadocs_type_table:
    template: mdx_component
    label: Type Table
    icon: table_chart
    value:
      component: TypeTable
      props:
        # 通常 children 是表格内容，或通过其他方式传入类型
      children: ""

  fumadocs_auto_type_table:
    template: mdx_component
    label: Auto Type Table
    icon: auto_awesome
    value:
      component: AutoTypeTable
      props:
        path: "./path/to/your-file.ts"
        name: "YourTypeName"

  # ── 其他你提到的简单标签 ──

  fumadocs_no_toc:
    template: markdown
    label: No TOC [!toc]
    icon: toc
    value: "<[!toc]"

  fumadocs_slug_anchor:
    template: markdown
    label: Custom Slug Anchor [#slug]
    icon: anchor
    value: "[#$1]"

  fumadocs_include:
    template: mdx_component
    label: Include File
    icon: input
    value:
      component: include
      props: {}
      children: "$1"   # 文件路径