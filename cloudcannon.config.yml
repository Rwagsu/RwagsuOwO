_inputs:
  title:
    type: text
    comment: Title
  description:
    type: text
    comment: Description
  icon:
    type: text
    comment: Icon (Lucide Icon)
  avatars:
    type: multiselect
    comment: 作者 (ID)
    options:
      values:
        - rwagsu
        - drownedowo
      values_labels:
        rwagsu: "Rwagsu - 全能 Furry 控"
        drownedowo: "DrownedOwO - 被绑架来的 QAQ"
  time:
    type: date
    comment: 创建时间
  tags:
    type: array
    comment: 标签
    options:
      structures: _structures.tag
  type:
    type: select
    comment: 文档类型
    options:
      values:
        - base
        - image
        - video
        - audio
        - code
        - subHero
        - none
      default: base

  # ============== Object 使用 fields: 写法（彻底解决 empty 报错） ==============
  headerImage:
    type: object
    comment: Header 图片 (Link)
    options:
      collapsed: true
      subtype: object
    fields:
      alt:
        type: text
        comment: Alt 文本
      src:
        type: image
        comment: 图片路径（建议用上传）

  image:
    type: object
    comment: IMAGE 配置...
    options:
      collapsed: true
      subtype: object
    fields:
      alt: { type: text }
      src:
        type: image
        options:
          width: 1200
          resize_style: crop

  video:
    type: object
    ...
    options:
      collapsed: true
      subtype: object
    fields: ...

  audio:
    type: object
    ...
    options:
      collapsed: true
      subtype: object
    fields: ...

  code:
    type: object
    comment: Code 配置...
    options:
      collapsed: true
      subtype: object
    fields:
      maintenanceLevel: ...
      githubInfo:
        type: object
        comment: GitHub 信息
        options:
          collapsed: true
          subtype: object
        fields:
          user: { type: text }
          repo: { type: text }
          branch:
            type: text
            instance_value: main
      icon:
        type: object
        comment: Icon (Link)
        options:
          collapsed: true
          subtype: object
        fields:
          alt: { type: text }
          src: { type: image }
      buttons:
        type: array
        options:
          structures: _structures.button

  hero:
    type: object
    comment: SubHero 配置...
    options:
      collapsed: true
      subtype: object
    fields:
      buttons:
        type: array
        options:
          structures: _structures.button
      icon:
        type: object
        comment: 图标 (Link)
        options:
          collapsed: true
          subtype: object
        fields:
          alt: { type: text }
          src: { type: image }

markdown:
  engine: commonmark
  options:
    xhtml: false
    breaks: false
    linkify: false
    typographer: false
    spaced_lists: false
    sentence_per_line: false
    gfm: false
    code_block_fences: '```'
    escape_snippets_in_code_blocks: false
    treat_indentation_as_code: false
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    attributes: false

_structures:
  tag:
    label: 标签
    icon: label
    value:
      text: ""
      icon: ""
      variant: secondary
    _inputs:
      variant:
        type: select
        options:
          values:
            - outline
            - ghost
            - link
            - default
            - secondary
            - destructive
  button:
    label: 按钮
    icon: smart_button
    value:
      text: ""
      href: ""
      icon: ""
      variant: default
    _inputs:
      variant:
        type: select
        options:
          values:
            - outline
            - ghost
            - link
            - default
            - secondary
            - destructive

_snippets_imports:
  mdx: true

_editables:
  mdx:
    input: mdx
    allow_blocks: true
    allow_inline: true

_snippets:
  fumadocs_card:
    template: mdx_paired_component
    label: Card (Fumadocs)
    icon: card_membership
    value:
      component: Card
      props:
        icon: ""
        href: ""
        title: ""
      children: ""
  fumadocs_callout:
    template: mdx_paired_component
    label: Callout (Fumadocs)
    icon: announcement
    value:
      component: Callout
      props:
        title: ""
        type: info
      children: ""
  fumadocs_steps:
    template: mdx_paired_component
    label: Steps Wrapper (Fumadocs)
    icon: format_list_numbered
    value:
      component: div
      props:
        className: "fd-steps [&_h2]:fd-step [&_h3]:fd-step"
      children: "## 第一步\n\n描述内容..."
  fumadocs_accordion:
    template: mdx_paired_component
    label: Accordion (Fumadocs)
    icon: keyboard_arrow_down
    value:
      component: Accordion
      props:
        type: single
        collapsible: true
      children: ""
  fumadocs_tabs:
    template: mdx_paired_component
    label: Tabs (Fumadocs 示例)
    icon: tab
    value:
      component: fragment
      children: |
        ```ts tab="Tab 1"
        // 内容...
        ```

        ```ts tab="Tab 2"
        // 内容...
        ```
  fumadocs_code_linenumbers:
    template: mdx_component
    label: Code block with lineNumbers
    icon: numbers
    value:
      component: code
      children: "```tsx lineNumbers\n你的代码在这里\n```"
  fumadocs_code_twoslash:
    template: mdx_component
    label: Code block with Twoslash
    icon: code
    value:
      component: code
      children: "```tsx twoslash\n你的代码在这里\n```"
  fumadocs_code_highlight:
    template: mdx_component
    label: "[!code highlight]"
    icon: highlight
    value:
      component: text
      children: '// [!code highlight]'
  fumadocs_code_add:
    template: mdx_component
    label: "[!code ++] 添加行"
    icon: add
    value:
      component: text
      children: '// [!code ++]'
  fumadocs_code_remove:
    template: mdx_component
    label: "[!code --] 删除行"
    icon: remove
    value:
      component: text
      children: '// [!code --]'
  fumadocs_code_focus:
    template: mdx_component
    label: "[!code focus] 聚焦行"
    icon: center_focus_strong
    value:
      component: text
      children: '// [!code focus]'
  fumadocs_files:
    template: mdx_paired_component
    label: Files / Folder Tree
    icon: folder
    value:
      component: Files
      props: {}
      children: |
        <Folder name="src" defaultOpen>
            <File name="index.tsx" />
        </Folder>
  fumadocs_github_info:
    template: mdx_component
    label: GitHub Info
    icon: github
    value:
      component: GithubInfo
      props:
        owner: ""
        repo: ""
  fumadocs_type_table:
    template: mdx_component
    label: Type Table
    icon: table_chart
    value:
      component: TypeTable
      props: {}
      children: ""
  fumadocs_auto_type_table:
    template: mdx_component
    label: Auto Type Table
    icon: auto_awesome
    value:
      component: AutoTypeTable
      props:
        path: "./path/to/your-file.ts"
        name: "YourTypeName"
  fumadocs_no_toc:
    template: mdx_component
    label: No TOC "[!toc]"
    icon: toc
    value:
      component: text
      children: '<[!toc]'
  fumadocs_slug_anchor:
    template: mdx_component
    label: Custom Slug Anchor [#slug]
    icon: anchor
    value:
      component: text
      children: '[#slug]'
  fumadocs_include:
    template: mdx_component
    label: Include File
    icon: input
    value:
      component: include
      props: {}
      children: ""