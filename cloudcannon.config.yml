paths:
  static: public
  uploads: public/images/docsImages
  collections: content

_editables:
  mdx:
    input: mdx
    allow_blocks: true     # 允许块级组件（如 Callout、Card）
    allow_inline: true

_snippets_imports:
  mdx: true
  
