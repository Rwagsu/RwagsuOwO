    schemas:
      default:
        path: schemas/default-frontmatter.mdx

  docs_en_about:
    path: content/docs/en/about
    name: About (en)
    icon: info
    url: /docs/about/[slug]
    disable_url: false
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    schemas:
      default:
        path: schemas/default-frontmatter.mdx

  docs_en_blog:
    path: content/docs/en/blog
    name: Blog (en)
    icon: videogame_asset
    url: /docs/blog/[slug]
